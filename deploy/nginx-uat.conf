# Kincore UAT — nginx site configs
# Domains:
#   Landing:  uat.kincore.com
#   Admin:    uat-admin.kincore.com
#   API:      uat-api.kincore.com
#
# Install: see setup-uat-domains.sh

# --- Landing (static) ---
server {
    listen 80;
    listen [::]:80;
    server_name uat.kincore.com;

    root /var/www/uat.kincore.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /join/CODE → join.html?code=CODE
    location ~ ^/join/([^/]+)/?$ {
        try_files /join.html =404;
        add_header Cache-Control "no-store";
        rewrite ^/join/([^/]+)/?$ /join.html?code=$1 break;
    }

    location = /join.html {
        add_header Cache-Control "no-store";
    }
}

# --- Admin panel (SPA static) ---
server {
    listen 80;
    listen [::]:80;
    server_name uat-admin.kincore.com;

    root /var/www/uat-admin.kincore.com;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- API (reverse proxy to Node/PM2) ---
upstream kincore_uat_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name uat-api.kincore.com;

    client_max_body_size 55m;

    location / {
        proxy_pass http://kincore_uat_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }
}
