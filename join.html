<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join Family — Kincore</title>
    <meta name="description" content="Join a Kincore family with your details — no prior login required." />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/join.css" />
    <script src="/theme.js"></script>
  </head>
  <body class="join-page">
    <div class="sky" aria-hidden="true"></div>

    <main class="join-stage">
      <a class="brand" href="/">
        <img src="/logo.png" width="48" height="48" alt="" class="brand-logo" />
        <span>Kincore</span>
      </a>

      <section class="join-card">
        <p class="eyebrow">Family Invite</p>
        <h1 id="join-title">Join This Family</h1>
        <p class="lede" id="join-lede">Enter your details below. No separate login step.</p>

        <p class="code-label">Invite Code</p>
        <p class="code-value" id="invite-code">—</p>
        <div id="qr-wrap" class="qr-wrap" hidden>
          <img id="qr-img" alt="Invite QR code" width="180" height="180" />
        </div>

        <form id="join-form" class="join-form" hidden>
          <label>
            First Name
            <input name="first_name" required autocomplete="given-name" />
          </label>
          <label>
            Last Name
            <input name="last_name" required autocomplete="family-name" />
          </label>
          <label>
            Email
            <input name="email" type="email" required autocomplete="email" />
          </label>
          <label>
            Password
            <input name="password" type="password" required minlength="6" autocomplete="new-password" />
          </label>
          <label>
            Gender (Optional)
            <select name="gender">
              <option value="">—</option>
              <option value="female">Female</option>
              <option value="male">Male</option>
              <option value="other">Other</option>
            </select>
          </label>
          <button type="submit" class="btn primary" id="submit-btn">Join Family</button>
          <p class="fine" id="form-status" role="status"></p>
        </form>

        <div class="cta-row" id="fallback-actions">
          <a class="btn soft" id="open-app" href="#">Open In Kincore App</a>
          <button type="button" class="btn soft" id="copy-code">Copy Code</button>
        </div>
      </section>
    </main>

    <script>
      (function () {
        var API = "https://uat-api.kincore.com";
        var params = new URLSearchParams(window.location.search);
        var pathMatch = window.location.pathname.match(/\/join\/([^/?#]+)/i);
        var code = (params.get("code") || (pathMatch && pathMatch[1]) || "")
          .trim()
          .toUpperCase();

        var codeEl = document.getElementById("invite-code");
        var openApp = document.getElementById("open-app");
        var copyBtn = document.getElementById("copy-code");
        var title = document.getElementById("join-title");
        var lede = document.getElementById("join-lede");
        var form = document.getElementById("join-form");
        var statusEl = document.getElementById("form-status");
        var qrWrap = document.getElementById("qr-wrap");
        var qrImg = document.getElementById("qr-img");

        if (!code) {
          codeEl.textContent = "No code in this link";
          title.textContent = "Invite Link Incomplete";
          lede.textContent = "Ask your family admin to resend a full invite link or QR code.";
          openApp.href = "/";
          openApp.textContent = "Back To Kincore";
          return;
        }

        codeEl.textContent = code;
        openApp.href = "kincore://join/" + encodeURIComponent(code);

        fetch(API + "/api/families/join-info?code=" + encodeURIComponent(code))
          .then(function (r) {
            return r.json().then(function (d) {
              return { ok: r.ok, d: d };
            });
          })
          .then(function (res) {
            if (!res.ok) {
              title.textContent = "Invite Not Found";
              lede.textContent = res.d.error || "This invite code is invalid or expired.";
              return;
            }
            if (res.d.family_name) {
              title.textContent = "Join " + res.d.family_name;
            }
            if (res.d.qr_code_data_url) {
              qrImg.src = res.d.qr_code_data_url;
              qrWrap.hidden = false;
            }
            form.hidden = false;
          })
          .catch(function () {
            form.hidden = false;
            lede.textContent = "Enter your details to join.";
          });

        copyBtn.addEventListener("click", function () {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(code).then(function () {
              copyBtn.textContent = "Copied";
              setTimeout(function () {
                copyBtn.textContent = "Copy Code";
              }, 1600);
            });
          }
        });

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          statusEl.textContent = "Joining…";
          statusEl.style.color = "";
          var fd = new FormData(form);
          var body = {
            link: code,
            first_name: fd.get("first_name"),
            last_name: fd.get("last_name"),
            email: fd.get("email"),
            password: fd.get("password"),
            gender: fd.get("gender") || undefined,
          };
          fetch(API + "/api/families/join", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          })
            .then(function (r) {
              return r.json().then(function (d) {
                return { ok: r.ok, status: r.status, d: d };
              });
            })
            .then(function (res) {
              if (!res.ok) {
                statusEl.style.color = "#b42318";
                statusEl.textContent = res.d.error || "Could not join";
                return;
              }
              statusEl.style.color = "#2f6b4f";
              statusEl.textContent =
                (res.d.message || "Joined") +
                ". You can open the Kincore app and sign in with this email.";
              try {
                localStorage.setItem("kincore_join_token", res.d.token || "");
                localStorage.setItem("kincore_join_space", res.d.space_id || "");
              } catch (_) {}
              form.querySelectorAll("input, select, button").forEach(function (el) {
                el.disabled = true;
              });
            })
            .catch(function (err) {
              statusEl.style.color = "#b42318";
              statusEl.textContent = err.message || "Network error";
            });
        });
      })();
    </script>
  </body>
</html>
